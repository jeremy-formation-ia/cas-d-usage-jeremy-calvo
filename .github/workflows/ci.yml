name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train the model (produces the artifacts)
        run: python -m src.train

      - name: Run the test suite (includes the model contract test)
        run: pytest -v

  evaluate:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Continuous evaluation (blocks the release on regression)
        run: python -m src.evaluate --release-tag "${{ github.ref_name }}"

  build:
    needs: [test, evaluate]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image
        run: docker build -f api/Dockerfile -t bank-marketing-api:${{ github.sha }} .

      - name: Build the UI image
        run: docker build -f ui/Dockerfile -t bank-marketing-ui:${{ github.sha }} .
